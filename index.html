<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ascend — Learn, Practice, Interview</title>
<meta name="description" content="Learn engineering skills and practice realistic AI mock interviews." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#12151C;
  --ink-soft:#3C4250;
  --muted:#6B7280;
  --paper:#F4F6FA;
  --paper-2:#FFFFFF;
  --line:#E3E7EF;
  --primary:#2C3968;
  --primary-2:#1B2547;
  --primary-tint:#EAEDF8;
  --amber:#EE9F2E;
  --amber-tint:#FCF0DA;
  --teal:#189E86;
  --teal-tint:#E1F4F0;
  --coral:#DE5B3F;
  --coral-tint:#FBE7E1;
  --radius:16px;
  --radius-sm:10px;
  --shadow-1: 0 1px 2px rgba(18,21,28,0.06);
  --shadow-2: 0 10px 30px -12px rgba(18,21,28,0.22);
  --nav-w:250px;
  --topbar-h:64px;
  --bottomnav-h:64px;
  --transition: 180ms cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;}
.ic{width:18px; height:18px; flex:none; display:inline-block; vertical-align:-3px;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-width:320px;
}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; margin:0; color:var(--ink); line-height:1.15; font-weight:600;}
p{margin:0; color:var(--ink-soft); line-height:1.55;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
code, .mono{font-family:'JetBrains Mono',monospace;}
ul{margin:0; padding:0;}
img,svg{display:block;}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ============ LAYOUT SHELL ============ */
#app{min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.side-nav{
  width:var(--nav-w); flex:none; background:var(--primary-2); color:#fff;
  display:flex; flex-direction:column; padding:22px 16px; position:fixed; top:0; left:0; bottom:0; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 26px 8px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(155deg,var(--amber),#f6c165);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:var(--primary-2);font-size:16px;flex:none;}
.brand-name{font-family:'Space Grotesk'; font-weight:700; font-size:19px; color:#fff; letter-spacing:0.2px;}
.side-nav nav{display:flex; flex-direction:column; gap:2px; margin-top:6px;}
.nav-link{
  display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; color:#C7CCE0;
  font-size:14.5px; font-weight:500; transition:background var(--transition), color var(--transition); border:none; background:none; text-align:left; width:100%;
}
.nav-link .ic{width:19px; height:19px; flex:none; opacity:.9;}
.nav-link:hover{background:rgba(255,255,255,0.07); color:#fff;}
.nav-link.active{background:rgba(238,159,46,0.16); color:#fff;}
.nav-link.active .ic{color:var(--amber);}
.side-nav .spacer{flex:1;}
.side-foot{border-top:1px solid rgba(255,255,255,0.1); padding-top:14px; margin-top:10px;}
.profile-mini{display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px;}
.profile-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(155deg,#6B7CC9,#3A467E); display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none;}
.profile-mini .pn{font-size:13.5px; font-weight:600; color:#fff;}
.profile-mini .pr{font-size:12px; color:#9AA1BE;}

.main-col{flex:1; margin-left:var(--nav-w); min-width:0; display:flex; flex-direction:column;}
.topbar{
  height:var(--topbar-h); flex:none; display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; background:rgba(244,246,250,0.88); backdrop-filter:blur(6px); position:sticky; top:0; z-index:30;
  border-bottom:1px solid var(--line);
}
.topbar-title{font-family:'Space Grotesk'; font-weight:600; font-size:18px;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.streak-chip{display:flex; align-items:center; gap:6px; background:var(--amber-tint); color:#9C6A11; padding:6px 12px; border-radius:20px; font-size:13px; font-weight:600;}
.xp-chip{display:flex; align-items:center; gap:6px; background:var(--teal-tint); color:#0E6E5C; padding:6px 12px; border-radius:20px; font-size:13px; font-weight:600;}

.content{flex:1; padding:28px; max-width:1180px; width:100%; margin:0 auto;}
.bottom-nav{display:none;}

/* ============ COMMON COMPONENTS ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:11px; border:none;
  font-weight:600; font-size:14.5px; padding:12px 20px; transition:transform var(--transition), box-shadow var(--transition), background var(--transition), opacity var(--transition);
  white-space:nowrap;
}
.btn:active{transform:translateY(1px) scale(0.99);}
.btn-primary{background:var(--primary); color:#fff; box-shadow:var(--shadow-1);}
.btn-primary:hover{background:var(--primary-2); box-shadow:var(--shadow-2);}
.btn-amber{background:var(--amber); color:#3A2604;}
.btn-amber:hover{background:#e2911d;}
.btn-secondary{background:#fff; color:var(--primary); border:1.5px solid var(--line);}
.btn-secondary:hover{border-color:var(--primary); background:var(--primary-tint);}
.btn-ghost{background:transparent; color:var(--primary); padding:10px 8px;}
.btn-ghost:hover{background:var(--primary-tint);}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:9px;}
.btn:disabled{opacity:0.45; cursor:not-allowed; transform:none;}
.btn-block{width:100%;}

.card{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); transition:transform var(--transition), box-shadow var(--transition), border-color var(--transition);}
.card-pad{padding:20px;}
.card-hover:hover{transform:translateY(-3px); box-shadow:var(--shadow-2); border-color:#D7DCEA;}
.grid{display:grid; gap:18px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.split-2-1{grid-template-columns:2fr 1fr;}
.split-13-1{grid-template-columns:1.3fr 1fr;}
.row{display:flex; align-items:center;}
.between{justify-content:space-between;}
.gap-8{gap:8px;} .gap-10{gap:10px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
.wrap{flex-wrap:wrap;}
.section{margin-bottom:34px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
.section-head h2{font-size:20px;}
.muted{color:var(--muted);}
.small{font-size:13px;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px; font-size:12.5px; font-weight:600;}
.chip-primary{background:var(--primary-tint); color:var(--primary);}
.chip-amber{background:var(--amber-tint); color:#9C6A11;}
.chip-teal{background:var(--teal-tint); color:#0E6E5C;}
.chip-coral{background:var(--coral-tint); color:#A3391F;}
.chip-outline{background:#fff; border:1px solid var(--line); color:var(--muted);}

.progress-track{height:8px; background:var(--line); border-radius:20px; overflow:hidden; width:100%;}
.progress-fill{height:100%; border-radius:20px; background:linear-gradient(90deg,var(--primary),#5567AE); transition:width 500ms cubic-bezier(.2,.7,.3,1);}
.progress-fill.teal{background:linear-gradient(90deg,var(--teal),#3ec4a8);}
.progress-fill.amber{background:linear-gradient(90deg,var(--amber),#f6c165);}
.progress-fill.coral{background:linear-gradient(90deg,var(--coral),#ec8367);}

.icon-box{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:none;}
.crumbs{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-bottom:16px; flex-wrap:wrap;}
.crumbs a:hover{color:var(--primary);}
.crumbs .sep{opacity:.5;}

.badge-dot{width:8px;height:8px;border-radius:50%; flex:none;}

/* ============ HOME ============ */
.hero{
  background:linear-gradient(120deg,var(--primary-2) 0%, var(--primary) 62%, #3B4A8C 100%);
  border-radius:22px; padding:44px 40px; color:#fff; position:relative; overflow:hidden; margin-bottom:30px;
}
.hero::after{content:''; position:absolute; right:-60px; top:-60px; width:320px; height:320px; border-radius:50%; background:radial-gradient(circle, rgba(238,159,46,0.25), transparent 70%);}
.hero h1{font-size:38px; color:#fff; max-width:640px; position:relative; z-index:1;}
.hero p.lead{color:#D6DAEE; max-width:520px; margin-top:14px; font-size:15.5px; position:relative; z-index:1;}
.hero .actions{display:flex; gap:12px; margin-top:26px; position:relative; z-index:1; flex-wrap:wrap;}
.hero .stats{display:flex; gap:28px; margin-top:32px; position:relative; z-index:1; flex-wrap:wrap;}
.hero .stat b{font-family:'Space Grotesk'; font-size:22px; display:block; color:#fff;}
.hero .stat span{font-size:12.5px; color:#AEB4D6;}

.quick-tile{display:flex; align-items:center; gap:14px; padding:16px; cursor:pointer;}
.quick-tile .arrow{margin-left:auto; opacity:0; transform:translateX(-4px); transition:all var(--transition); color:var(--primary);}
.quick-tile:hover .arrow{opacity:1; transform:translateX(0);}
.quick-tile:hover .icon-box{transform:translateY(-2px);}
.icon-box{transition:transform var(--transition);}

/* ============ BRANCH / SKILL CARDS ============ */
.branch-card{padding:20px; cursor:pointer; display:flex; flex-direction:column; gap:12px;}
.branch-card .top{display:flex; align-items:center; gap:14px;}
.branch-card:hover{border-color:var(--primary);}
.branch-card:hover .arrow{transform:translateX(2px); opacity:1;}
.branch-card .arrow{opacity:.4; transition:all var(--transition);}
.skill-tags{display:flex; flex-wrap:wrap; gap:6px;}

.skill-row{display:flex; align-items:center; gap:16px; padding:16px 18px; cursor:pointer;}
.skill-row:hover{border-color:var(--primary); background:#FAFBFF;}
.skill-row .swatch{width:42px; height:42px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; color:#fff; font-size:15px;}
.skill-row .meta{flex:1; min-width:0;}
.skill-row .prog-num{font-family:'Space Grotesk'; font-weight:700; font-size:15px; flex:none; width:52px; text-align:right;}

.level-track{display:flex; flex-direction:column; gap:0;}
.level-item{display:flex; align-items:flex-start; gap:16px; padding:18px 4px; position:relative; cursor:pointer;}
.level-item .dot-col{display:flex; flex-direction:column; align-items:center; flex:none; width:34px;}
.level-item .dot{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; border:2px solid var(--line); background:#fff; color:var(--muted); flex:none; z-index:1;}
.level-item .dot.done{background:var(--teal); border-color:var(--teal); color:#fff;}
.level-item .dot.current{background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 0 0 4px var(--primary-tint);}
.level-item .line{width:2px; flex:1; background:var(--line); margin-top:2px; min-height:22px;}
.level-item .line.done{background:var(--teal);}
.level-item .body{flex:1; padding-bottom:2px;}
.level-item:hover .body h4{color:var(--primary);}

/* ============ LESSON VIEW ============ */
.lesson-nav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
.lesson-tab{padding:8px 15px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--muted); background:#fff; border:1px solid var(--line); cursor:pointer;}
.lesson-tab.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.lesson-block{margin-bottom:26px;}
.lesson-block h3{font-size:15px; text-transform:none; color:var(--primary); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.scenario-box{background:var(--amber-tint); border:1px solid #F3DDAE; border-radius:14px; padding:18px 20px; font-size:14.5px; color:#5A4210;}
.scenario-box b{color:#3A2604;}
.code-box{background:#161B26; color:#DCE3F0; border-radius:14px; padding:18px 20px; font-size:13.5px; overflow-x:auto; line-height:1.7;}
.code-box .k{color:#EE9F2E;} .code-box .s{color:#78D6A6;} .code-box .c{color:#7C87A6;}
.activity-box{border:1.5px dashed #C9CFE0; border-radius:14px; padding:18px 20px; background:#FAFBFF;}

.quiz-q{padding:18px 20px; margin-bottom:14px;}
.quiz-opt{display:flex; align-items:center; gap:10px; padding:11px 14px; border:1.5px solid var(--line); border-radius:10px; margin-top:8px; cursor:pointer; font-size:14px; transition:all var(--transition);}
.quiz-opt:hover{border-color:var(--primary); background:var(--primary-tint);}
.quiz-opt.selected{border-color:var(--primary); background:var(--primary-tint);}
.quiz-opt.correct{border-color:var(--teal); background:var(--teal-tint);}
.quiz-opt.incorrect{border-color:var(--coral); background:var(--coral-tint);}
.quiz-opt.disabled{cursor:default;}
.opt-letter{width:24px; height:24px; border-radius:50%; background:#fff; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none; color:var(--muted);}

.mastery-ring{width:104px;height:104px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; flex:none;}
.mastery-ring svg{position:absolute; inset:0;}
.mastery-ring .num{font-family:'Space Grotesk'; font-weight:700; font-size:22px; z-index:1;}

/* ============ INTERVIEW ============ */
.mode-card{padding:26px 22px; cursor:pointer; display:flex; flex-direction:column; gap:14px; position:relative;}
.mode-card .icon-box{width:52px;height:52px; border-radius:14px; font-size:22px;}
.mode-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-2); border-color:var(--primary);}
.mode-card .go{position:absolute; right:20px; bottom:22px; opacity:0; transform:translateX(-6px); transition:all var(--transition); color:var(--primary); font-weight:700;}
.mode-card:hover .go{opacity:1; transform:translateX(0);}

.upload-zone{border:2px dashed #C9CFE0; border-radius:16px; padding:38px 24px; text-align:center; background:#FAFBFF; cursor:pointer; transition:all var(--transition);}
.upload-zone:hover{border-color:var(--primary); background:var(--primary-tint);}
.upload-zone.filled{border-style:solid; border-color:var(--teal); background:var(--teal-tint);}

.detect-row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border:1px solid var(--line); border-radius:11px; margin-bottom:8px; background:#fff;}
.detect-row.missing{border-color:#F3CBBB; background:var(--coral-tint);}

.stage-track-v{display:flex; flex-direction:column; gap:0; width:150px; flex:none;}
.stage-item{display:flex; align-items:flex-start; gap:10px; position:relative; padding-bottom:30px;}
.stage-item:last-child{padding-bottom:0;}
.stage-item .sdot{width:26px; height:26px; border-radius:50%; background:#fff; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; flex:none; z-index:1;}
.stage-item .sdot.done{background:var(--teal); border-color:var(--teal);}
.stage-item .sdot.current{background:var(--primary); border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-tint);}
.stage-item .sline{position:absolute; left:12px; top:26px; bottom:0; width:2px; background:var(--line);}
.stage-item .sline.done{background:var(--teal);}
.stage-item .slabel{font-size:13.5px; font-weight:600; margin-top:2px;}
.stage-item .sscore{font-size:12px; color:var(--muted);}
.stage-track-h{display:none;}
.stage-layout{display:flex; gap:16px; align-items:flex-start;}

.difficulty-card{padding:20px; text-align:center; cursor:pointer; border-width:1.5px;}
.difficulty-card.selected{border-color:var(--primary); background:var(--primary-tint);}
.difficulty-card .emoji{font-size:28px; margin-bottom:6px;}

.interview-stage{background:#0F1320; border-radius:22px; padding:0; overflow:hidden; color:#fff; position:relative;}
.interview-top{display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid rgba(255,255,255,0.08);}
.interview-top .qcount{font-size:13px; color:#9BA3C4;}
.interview-body{padding:34px 30px 26px; display:flex; gap:28px; align-items:flex-start;}
.ai-avatar{width:118px; height:118px; border-radius:18px; flex:none; background:linear-gradient(160deg,#232A44,#161B2E); display:flex; align-items:center; justify-content:center; position:relative; border:1px solid rgba(255,255,255,0.08);}
.ai-avatar.talking .mouth{animation:talk 0.5s infinite alternate;}
@keyframes talk{from{height:3px;} to{height:7px;}}
.qzone{flex:1; min-width:0;}
.qlabel{font-size:12.5px; color:#EE9F2E; font-weight:700; letter-spacing:0.3px; margin-bottom:10px;}
.qtext{font-family:'Space Grotesk'; font-size:24px; font-weight:600; line-height:1.4; color:#fff;}
.caption-box{margin-top:16px; background:rgba(255,255,255,0.06); border-radius:10px; padding:10px 14px; font-size:13.5px; color:#C7CCE0; min-height:20px;}
.replay-btn{margin-top:16px;}
.interview-bottom{padding:20px 30px 28px; border-top:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.02);}
.cam-prompt{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.cam-prompt-text{flex:1; min-width:200px;}
.cam-prompt-actions{display:flex; gap:10px; flex-wrap:wrap; flex:none;}
.cam-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.cam-preview{width:130px; height:96px; border-radius:12px; background:#000; overflow:hidden; flex:none; border:1px solid rgba(255,255,255,0.15); position:relative;}
.cam-preview video{width:100%; height:100%; object-fit:cover;}
.cam-off{display:flex; align-items:center; justify-content:center; height:100%; color:#666; font-size:11px; text-align:center; padding:4px;}
.mic-controls{display:flex; align-items:center; gap:12px; flex:1;}
.mic-btn{width:56px; height:56px; border-radius:50%; background:var(--coral); color:#fff; border:none; display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; box-shadow:0 0 0 0 rgba(222,91,63,0.5); transition:all var(--transition);}
.mic-btn.listening{animation:pulse 1.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(222,91,63,0.5);} 70%{box-shadow:0 0 0 14px rgba(222,91,63,0);} 100%{box-shadow:0 0 0 0 rgba(222,91,63,0);}}
.waveform{display:flex; align-items:center; gap:3px; height:32px; flex:1;}
.waveform span{width:3px; background:var(--amber); border-radius:2px; height:6px;}
.waveform.active span{animation:wf 0.8s infinite ease-in-out;}
.waveform span:nth-child(2n){animation-delay:0.15s;} .waveform span:nth-child(3n){animation-delay:0.3s;}
@keyframes wf{0%,100%{height:6px;} 50%{height:26px;}}
.transcript-box{margin-top:16px; background:rgba(255,255,255,0.05); border-radius:12px; padding:14px 16px; font-size:14px; color:#E6E9F4; min-height:44px;}
.transcript-box .ph{color:#6B7394;}

.eval-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:18px 0;}
.eval-cell{text-align:center; background:#F7F8FC; border-radius:12px; padding:12px 6px;}
.eval-cell b{font-family:'Space Grotesk'; font-size:19px; display:block;}
.eval-cell span{font-size:11px; color:var(--muted);}
.feedback-note{background:var(--primary-tint); border-radius:12px; padding:14px 16px; font-size:14px; color:var(--primary-2); border-left:3px solid var(--primary);}

.result-hero{display:flex; align-items:center; gap:26px; flex-wrap:wrap;}
.score-ring{width:150px; height:150px; border-radius:50%; flex:none; position:relative; display:flex; align-items:center; justify-content:center;}
.score-ring svg{position:absolute; inset:0;}
.score-ring .num{font-family:'Space Grotesk'; font-weight:700; font-size:34px; z-index:1;}
.score-ring .lbl{position:absolute; bottom:26px; font-size:11px; color:var(--muted); z-index:1;}

.strength-list li, .weak-list li{display:flex; align-items:flex-start; gap:8px; font-size:14px; margin-bottom:8px; color:var(--ink-soft);}
.improve-compare{display:flex; align-items:center; gap:18px; justify-content:center; padding:20px 0;}
.improve-compare .ibox{text-align:center;}
.improve-compare .ibox b{font-family:'Space Grotesk'; font-size:28px; display:block;}
.improve-compare .arrow-mid{font-size:22px; color:var(--teal);}

/* ============ CHECKLIST ============ */
.check-row{display:flex; align-items:center; gap:10px; padding:11px 14px; border:1.5px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; font-size:14px; font-weight:500;}
.check-row.checked{border-color:var(--primary); background:var(--primary-tint);}
.checkbox{width:18px; height:18px; border-radius:5px; border:2px solid #C9CFE0; flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
.check-row.checked .checkbox{background:var(--primary); border-color:var(--primary);}

.count-pill{display:flex; gap:8px;}
.count-pill button{padding:9px 18px; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-weight:600; font-size:14px;}
.count-pill button.selected{border-color:var(--primary); background:var(--primary-tint); color:var(--primary);}

.empty-note{text-align:center; padding:40px 20px; color:var(--muted); font-size:14px;}

/* ============ RESPONSIVE ============ */
@media (max-width: 1020px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
}
@media (max-width: 900px){
  .side-nav{display:none;}
  .main-col{margin-left:0;}
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; height:var(--bottomnav-h); background:#fff;
    border-top:1px solid var(--line); z-index:40; padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav a{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted); font-size:11px; font-weight:600; border:none; background:none;}
  .bottom-nav a.active{color:var(--primary);}
  .bottom-nav .ic{width:20px; height:20px;}
  body{padding-bottom:var(--bottomnav-h);}
  .content{padding:18px; padding-bottom:30px;}
  .topbar{padding:0 16px;}
  .hero{padding:28px 22px;}
  .hero h1{font-size:27px;}

  .qtext{font-size:19px;}

  .cam-prompt-actions{width:100%;}

}

  .cam-row{flex-direction:column; align-items:stretch;}
  .mic-controls{width:100%;}
}

function getLesson(skillId, levelKey){

  if(CUSTOM_LESSONS[key]) return CUSTOM_LESSONS[key];
  return genericLesson(skillName, levelLabel, branchName);

function getInterviewQuestions(skillIds, level, count){
  let pool = [];
  skillIds.forEach(id=>{
    const bank = INTERVIEW_BANK[id];
    if(bank){
      const lvl = bank[level] || bank.beginner || [];
      pool = pool.concat(lvl);
    }
  });
  if(pool.length===0){ pool = INTERVIEW_BANK.general[level] || INTERVIEW_BANK.general.beginner; }
  // pad using general questions if not enough
  const general = INTERVIEW_BANK.general[level] || INTERVIEW_BANK.general.beginner;
  let i=0;
  while(pool.length < count && i < general.length*3){ pool.push(general[i % general.length]); i++; }
  // shuffle lightly then slice
  const shuffled = pool.slice().sort(()=>Math.random()-0.5);
  return shuffled.slice(0, count);
}

  evaluateAnswer(question, transcript){

    const words = (transcript||'').trim().split(/\s+/).filter(Boolean);
    const lower = (transcript||'').toLowerCase();
    let kwHits = 0;
    (question.keywords||[]).forEach(k=>{ if(lower.includes(k)) kwHits++; });
    const kwRatio = (question.keywords||[]).length? kwHits/(question.keywords.length) : 0.5;
    const lengthScore = Math.min(1, words.length/45);

    const clamp = v=>Math.max(3, Math.min(10, Math.round(v*10)));
    const technical = clamp(base + kwRatio*0.3);
    const relevance = clamp(base + kwRatio*0.2);
    const communication = clamp(0.5 + lengthScore*0.4 + Math.random()*0.15);
    const confidence = clamp(0.5 + lengthScore*0.3 + Math.random()*0.2);

  },
};

  const c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  return '<div class="mastery-ring" style="width:'+size+'px;height:'+size+'px;">'+
    '<svg viewBox="0 0 '+size+' '+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="8"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>'+
    '<div class="num">'+pct+'%</div>'+
  '</div>'+(label?'<div class="small muted" style="text-align:center;margin-top:6px;">'+label+'</div>':'');
}

    '<div class="lesson-block"><h3>'+Icon('practice','ic')+' Example</h3><div class="code-box"><pre style="margin:0;white-space:pre-wrap;">'+lesson.code+'</pre></div></div>'+

    '<div class="lesson-block"><h3>'+Icon('check','ic')+' Interactive activity</h3><div class="activity-box"><p>'+lesson.activity+'</p></div></div>'+

    '<div class="lesson-block"><h3>'+Icon('progress','ic')+' Mini quiz</h3><div id="quiz-area">'+renderQuiz(lesson.quiz)+'</div></div>'+

    '<div class="lesson-block"><h3>'+Icon('interview','ic')+' Quick challenge</h3><div id="game-area">'+renderGame(skillId)+'</div></div>'+

    '<div class="card card-pad row between" style="margin-top:8px;">'+
      '<div><div style="font-weight:600;">Mastery for this skill</div><div class="small muted">Complete the quiz above to update it.</div></div>'+
      ring(state.learningProgress[skillId]||0, 'var(--teal)', 74)+
    '</div>'
  );
}

function renderQuiz(questions){
  const qs = lessonQuizState;
  const submitted = qs.submitted;
  let correctCount = 0;
  if(submitted){
    questions.forEach((q,i)=>{ if(qs.answers[i]===q.correct) correctCount++; });
  }
  return questions.map((q,i)=>{
    const chosen = qs.answers[i];
    return '<div class="card quiz-q">'+
      '<div style="font-weight:600;margin-bottom:2px;">'+(i+1)+'. '+q.q+'</div>'+
      q.options.map((opt,oi)=>{
        let cls='quiz-opt'+(submitted?' disabled':'');
        if(submitted){
          if(oi===q.correct) cls+=' correct';
          else if(oi===chosen) cls+=' incorrect';
        } else if(chosen===oi){ cls+=' selected'; }
        return '<div class="'+cls+'" onclick="'+(submitted?'':'App.selectQuizAnswer('+i+','+oi+')')+'"><span class="opt-letter">'+String.fromCharCode(65+oi)+'</span><span>'+opt+'</span></div>';
      }).join('')+
      (submitted? '<div class="small muted" style="margin-top:8px;">'+q.explain+'</div>':'')+
    '</div>';
  }).join('') +
  (!submitted?
    '<button class="btn btn-primary" onclick="App.submitQuiz()" '+(Object.keys(qs.answers).length<questions.length?'disabled':'')+'>Submit quiz ('+Object.keys(qs.answers).length+'/'+questions.length+' answered)</button>'
    :
    '<div class="card card-pad" style="margin-top:6px;">'+
      '<div class="row between"><div><div style="font-weight:700;font-size:17px;">Score: '+correctCount+'/'+questions.length+'</div><div class="small muted">+'+(correctCount*10)+' XP earned</div></div>'+
      '<button class="btn btn-secondary btn-sm" onclick="App.retryQuiz()">Retry quiz</button></div>'+
      '<div class="progress-track" style="margin-top:12px;"><div class="progress-fill teal" style="width:'+Math.round(correctCount/questions.length*100)+'%"></div></div>'+
    '</div>'
  );
}

function renderGame(skillId){
  const set = getGameSet(skillId);
  if(!lessonGameState.key || lessonGameState.key!==skillId){
    lessonGameState = {key:skillId, idx:0, score:0, answered:false, chosen:null};
  }
  const gs = lessonGameState;
  if(gs.idx >= set.length){
    return '<div class="card card-pad" style="text-align:center;">'+
      '<div style="font-weight:700;font-size:17px;">Challenge complete — '+gs.score+'/'+set.length+' correct 🎉</div>'+
      '<button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="App.restartGame(\''+skillId+'\')">Play again</button>'+
    '</div>';
  }
  const item = set[gs.idx];
  return '<div class="card card-pad">'+
    '<div class="small muted" style="margin-bottom:8px;">Predict the output — question '+(gs.idx+1)+' of '+set.length+'</div>'+
    '<div class="code-box" style="margin-bottom:14px;"><pre style="margin:0;white-space:pre-wrap;">'+item.code+'</pre></div>'+
    '<div class="grid grid-2">'+
      item.options.map((o,oi)=>{
        let cls='quiz-opt'+(gs.answered?' disabled':'');
        if(gs.answered){ if(oi===item.correct) cls+=' correct'; else if(oi===gs.chosen) cls+=' incorrect'; }
        return '<div class="'+cls+'" onclick="'+(gs.answered?'':'App.answerGame('+oi+')')+'"><span class="opt-letter">'+String.fromCharCode(65+oi)+'</span><span>'+o+'</span></div>';
      }).join('')+
    '</div>'+
    (gs.answered? '<button class="btn btn-primary btn-sm" style="margin-top:14px;" onclick="App.nextGame()">Next</button>' : '')+
  '</div>';
}

/* =========================================================================

========================================================================= */
function stageTrack(currentStage, scores){
  const stages = [{key:'prep',label:'Preparation'},{key:'mocktest',label:'Mock Test'},{key:'interview',label:'Interview'}];
  const idx = stages.findIndex(s=>s.key===currentStage);
  const vertical = stages.map((s,i)=>{
    const done = i<idx, current = i===idx;
    return '<div class="stage-item">'+
      '<div class="sdot '+(done?'done':current?'current':'')+'">'+(done?Icon('check','ic'):'')+'</div>'+
      (i<stages.length-1? '<div class="sline '+(done?'done':'')+'"></div>' : '')+
      '<div><div class="slabel">'+s.label+'</div>'+(scores[s.key]!=null? '<div class="sscore">'+scores[s.key]+'%</div>' : current? '<div class="sscore">Current</div>':'')+'</div>'+
    '</div>';
  }).join('');
  const horiz = stages.map((s,i)=>{
    const done = i<idx, current = i===idx;
    return '<div class="stage-item"><div class="sdot '+(done?'done':current?'current':'')+'">'+(done?Icon('check','ic'):'')+'</div><div class="slabel">'+s.label+'</div>'+(scores[s.key]!=null?'<div class="sscore">'+scores[s.key]+'%</div>':'')+'</div>';
  }).join('');
  return '<div class="stage-track-v">'+vertical+'</div><div class="stage-track-h">'+horiz+'</div>';
}

function strongAreas(qs){
  const bySkill = {};
  qs.forEach((q,i)=>{ bySkill[q.skill]=bySkill[q.skill]||[]; bySkill[q.skill].push(mockTestState.answers[i]===q.correct); });
  return Object.keys(bySkill).filter(s=> bySkill[s].filter(Boolean).length/bySkill[s].length >= 0.6).map(s=>skillLabel(s)).slice(0,3);
}
function weakAreasList(qs){
  const bySkill = {};
  qs.forEach((q,i)=>{ bySkill[q.skill]=bySkill[q.skill]||[]; bySkill[q.skill].push(mockTestState.answers[i]===q.correct); });
  const weak = Object.keys(bySkill).filter(s=> bySkill[s].filter(Boolean).length/bySkill[s].length < 0.6).map(s=>skillLabel(s));
  return weak.length? weak.slice(0,3) : ['None — nice work'];
}
function weakSkillIds(qs){
  const bySkill = {};
  qs.forEach((q,i)=>{ bySkill[q.skill]=bySkill[q.skill]||[]; bySkill[q.skill].push(mockTestState.answers[i]===q.correct); });
  return Object.keys(bySkill).filter(s=> bySkill[s].filter(Boolean).length/bySkill[s].length < 0.6);
}
function skillLabel(id){ const f=findSkill(id); return f? f.skill.name : id; }

      navigator.mediaDevices.getUserMedia({video:true, audio:false}).then(function(stream){
        s.camera.stream = stream;
        const v = document.getElementById('cam-video');
        if(v){ v.srcObject = stream; }
      }).catch(function(){ s.camera.active=false; render(); });
    }

    if(v && !v.srcObject){ v.srcObject = s.camera.stream; }

/* =========================================================================
   VIEW: INTERVIEW RESULTS
========================================================================= */
function viewInterviewResults(){
  const s = state.interviewSession;
  if(!s || s.answers.length===0){
    return '<div class="empty-note">No completed interview yet. <a href="javascript:void(0)" onclick="App.navigate(\'interview\')" style="color:var(--primary);font-weight:600;">Start one</a>.</div>';
  }
  const n = s.answers.length;
  const avg = key => Math.round(s.answers.reduce((a,x)=>a+x.eval[key],0)/n*10);
  const overall = Math.round(s.answers.reduce((a,x)=>a+x.eval.overall,0)/n*10);
  const categories = {technical:avg('technical'), communication:avg('communication'), confidence:avg('confidence'), relevance:avg('relevance'), problemSolving:avg('completeness')};
  const weakSkills = [...new Set(s.answers.filter(a=>a.eval.overall<6.5).map(a=>a.question.skill))];
  const strengths = [];
  const improvements = [];
  Object.keys(categories).forEach(k=>{ if(categories[k]>=78) strengths.push(catLabel(k)); else if(categories[k]<65) improvements.push(catLabel(k)); });
  if(strengths.length===0) strengths.push('Consistent effort across questions');
  if(improvements.length===0) improvements.push('Fine-tune answer structure for even higher scores');

  const prev = state.interviewHistory[state.interviewHistory.length-1];

  if(!s.saved){
    state.interviewHistory.push({date:'Today', mode:setupState.mode||'skill', level:s.level, overall, categories});
    weakSkills.forEach(id=>{ state.learningProgress[id] = Math.max(0, (state.learningProgress[id]||40) - 5); });
    addXP(overall);
    s.saved = true;
  }

  return (
    '<div style="text-align:center;margin-bottom:10px;"><span class="chip chip-teal" style="font-size:14px;padding:8px 16px;">Interview completed 🎉</span></div>'+
    '<div class="card card-pad result-hero" style="margin-bottom:24px;">'+
      scoreRing(overall)+
      '<div style="flex:1;min-width:240px;">'+
        Object.keys(categories).map(k=>
          '<div style="margin-bottom:10px;"><div class="row between small" style="margin-bottom:4px;"><span class="muted">'+catLabel(k)+'</span><span style="font-weight:600;">'+categories[k]+'%</span></div><div class="progress-track"><div class="progress-fill" style="width:'+categories[k]+'%"></div></div></div>'
        ).join('')+
      '</div>'+
    '</div>'+

    '<div class="grid grid-2 section">'+
      '<div class="card card-pad"><h3 style="font-size:15px;margin-bottom:10px;">Strengths</h3><ul class="strength-list">'+strengths.map(x=>'<li>'+Icon('check','ic')+' '+x+'</li>').join('')+'</ul></div>'+
      '<div class="card card-pad"><h3 style="font-size:15px;margin-bottom:10px;">Needs improvement</h3><ul class="weak-list">'+improvements.map(x=>'<li>⚠ '+x+'</li>').join('')+'</ul></div>'+
    '</div>'+

    (s.camera.active? '<div class="card card-pad section"><h3 style="font-size:15px;margin-bottom:8px;">Presentation notes</h3><p class="small">Try looking toward the camera a little more consistently, and keep your shoulders relaxed and centered in frame. These are general presentation tips, not an assessment of how you felt.</p></div>' : '')+

    '<div class="card card-pad section">'+
      '<h3 style="font-size:15px;margin-bottom:12px;">Recommended learning</h3>'+
      (weakSkills.length? weakSkills.map(id=>{
        const f = findSkill(id); if(!f) return '';
        return '<div class="row between" style="padding:10px 0;border-top:1px solid var(--line);"><div style="font-weight:600;font-size:14px;">'+f.skill.name+' <span class="small muted">'+(state.learningProgress[id]||0)+'% mastered</span></div><button class="btn btn-secondary btn-sm" onclick="App.navigate(\'skill\',{skillId:\''+id+'\'})">Start learning</button></div>';
      }).join('') : '<p class="small muted">No major weak areas detected — great consistency!</p>')+
    '</div>'+

    (prev? '<div class="card card-pad section"><h3 style="font-size:15px;margin-bottom:6px;text-align:center;">Improvement</h3>'+
      '<div class="improve-compare"><div class="ibox"><b>'+prev.overall+'</b><span class="small muted">Previous</span></div><div class="arrow-mid">'+(overall>=prev.overall?'→ ↑':'→')+'</div><div class="ibox"><b style="color:var(--teal);">'+overall+'</b><span class="small muted">Latest</span></div>'+
      '<div class="chip '+(overall>=prev.overall?'chip-teal':'chip-coral')+'" style="margin-left:10px;">'+(overall>=prev.overall?'+':'')+(overall-prev.overall)+'%</div></div>'+
    '</div>' : '')+

    '<div class="row wrap gap-10"><button class="btn btn-primary" onclick="App.retryInterview()">Re-interview</button><button class="btn btn-secondary" onclick="App.navigate(\'progress\')">View progress</button></div>'
  );
}
function scoreRing(score){
  const pct = score;
  const size=150, r=size/2-10, c=2*Math.PI*r, off=c-(pct/100)*c;
  return '<div class="score-ring"><svg viewBox="0 0 '+size+' '+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--primary)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg><div class="num">'+score+'</div><div class="lbl">/ 100</div></div>';
}

/* =========================================================================
   VIEW: PROGRESS DASHBOARD

  const last = state.interviewHistory[state.interviewHistory.length-1];
  return (
    '<div class="grid grid-2 section">'+
      '<div class="card card-pad">'+
        '<div class="row between" style="margin-bottom:12px;"><h2 style="font-size:17px;">Interview readiness</h2><span style="font-weight:700;font-family:\'Space Grotesk\';">'+readiness+'%</span></div>'+
        '<div class="progress-track" style="height:12px;"><div class="progress-fill" style="width:'+readiness+'%"></div></div>'+
        '<div class="grid grid-4" style="margin-top:18px;">'+
          Object.keys(last.categories).map(k=> '<div style="text-align:center;"><div style="font-family:\'Space Grotesk\';font-weight:700;font-size:18px;">'+last.categories[k]+'%</div><div class="small muted">'+catLabel(k)+'</div></div>').join('')+
        '</div>'+
      '</div>'+
      '<div class="card card-pad">'+
        '<h2 style="font-size:17px;margin-bottom:14px;">Learning mastery</h2>'+
        Object.keys(state.learningProgress).map(id=>{
          const f = findSkill(id); const name = f? f.skill.name : id;
          return '<div style="margin-bottom:10px;"><div class="row between small" style="margin-bottom:4px;"><span>'+name+'</span><span style="font-weight:600;">'+state.learningProgress[id]+'%</span></div><div class="progress-track"><div class="progress-fill teal" style="width:'+state.learningProgress[id]+'%"></div></div></div>';
        }).join('')+
      '</div>'+
    '</div>'+

    '<div class="grid grid-3 section">'+
      '<div class="card card-pad" style="text-align:center;"><div class="icon-box" style="margin:0 auto 10px;background:var(--amber-tint);color:#9C6A11;">'+Icon('flame')+'</div><div style="font-family:\'Space Grotesk\';font-weight:700;font-size:22px;">'+state.streak+' days</div><div class="small muted">Learning streak</div></div>'+
      '<div class="card card-pad" style="text-align:center;"><div class="icon-box" style="margin:0 auto 10px;background:var(--teal-tint);color:#0E6E5C;">'+Icon('bolt')+'</div><div style="font-family:\'Space Grotesk\';font-weight:700;font-size:22px;">'+state.xp+'</div><div class="small muted">Total XP</div></div>'+
      '<div class="card card-pad" style="text-align:center;"><div class="icon-box" style="margin:0 auto 10px;background:var(--primary-tint);color:var(--primary);">'+Icon('badge')+'</div><div style="font-family:\'Space Grotesk\';font-weight:700;font-size:22px;">'+state.badges.length+'</div><div class="small muted">Badges earned</div></div>'+
    '</div>'+

    '<div class="card card-pad">'+
      '<h2 style="font-size:17px;margin-bottom:14px;">Interview history</h2>'+
      state.interviewHistory.slice().reverse().map(h=>
        '<div class="row between" style="padding:12px 0;border-top:1px solid var(--line);"><div><div style="font-weight:600;font-size:14px;">'+h.mode+' · '+h.level+'</div><div class="small muted">'+h.date+'</div></div><span class="chip chip-primary">'+h.overall+'/100</span></div>'
      ).join('')+
    '</div>'
  );
}

   VIEW: ABOUT
========================================================================= */
function viewAbout(){
  return '<div class="card card-pad" style="max-width:680px;">'+
    '<h2 style="font-size:20px;margin-bottom:10px;">About Ascend</h2>'+
    '<p style="margin-bottom:12px;">Ascend connects structured skill learning with realistic AI-powered interview practice, so preparation and performance feed directly into each other: learn a concept, practice it, get interviewed on it, and come straight back to the exact lesson you need.</p>'+

/* =========================================================================
   TTS / STT helpers
========================================================================= */
let recognizer = null;
function speakText(text, onend){
  if(!('speechSynthesis' in window)){ if(onend) onend(); return; }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.98; u.pitch = 1.0;
    u.onend = function(){ if(onend) onend(); };
    window.speechSynthesis.speak(u);
  }catch(e){ if(onend) onend(); }
}

/* =========================================================================
   APP — action handlers exposed to inline onclick
========================================================================= */
window.App = {
  navigate,

  /* ---- learning: quiz ---- */
  selectQuizAnswer(i, oi){ lessonQuizState.answers[i]=oi; document.getElementById('quiz-area').innerHTML = renderQuiz(getLesson(state.lastLesson.skillId, state.lastLesson.levelKey).quiz); },
  submitQuiz(){
    lessonQuizState.submitted = true;
    const lesson = getLesson(state.lastLesson.skillId, state.lastLesson.levelKey);
    let correctCount=0; lesson.quiz.forEach((q,i)=>{ if(lessonQuizState.answers[i]===q.correct) correctCount++; });
    const skillId = state.lastLesson.skillId;
    const gain = Math.round((correctCount/lesson.quiz.length)*8);
    state.learningProgress[skillId] = Math.min(100, (state.learningProgress[skillId]||0) + gain);
    addXP(correctCount*10);
    document.getElementById('quiz-area').innerHTML = renderQuiz(lesson.quiz);
    const ringHolder = document.querySelector('.lesson-block:last-child + .card, .card.card-pad.row.between');
    render(); // re-render to reflect updated mastery ring & xp chip
  },
  retryQuiz(){ lessonQuizState = {key:state.lastLesson.skillId+state.lastLesson.levelKey, answers:{}, submitted:false}; render(); },

  /* ---- learning: game ---- */
  answerGame(oi){
    const set = getGameSet(lessonGameState.key);
    const item = set[lessonGameState.idx];
    lessonGameState.answered = true; lessonGameState.chosen = oi;
    if(oi===item.correct){ lessonGameState.score++; addXP(15); }
    document.getElementById('game-area').innerHTML = renderGame(lessonGameState.key);
  },
  nextGame(){ lessonGameState.idx++; lessonGameState.answered=false; lessonGameState.chosen=null; document.getElementById('game-area').innerHTML = renderGame(lessonGameState.key); },
  restartGame(skillId){ lessonGameState = {key:skillId, idx:0, score:0, answered:false, chosen:null}; document.getElementById('game-area').innerHTML = renderGame(skillId); },

  /* ---- practice ---- */
  selectPracticeAnswer(i,oi){ practiceState.answers[i]=oi; document.getElementById('practice-area').innerHTML = renderPracticeQuiz(MOCKTEST_BANK.slice(0,5)); },
  submitPractice(){ practiceState.submitted=true; addXP(20); document.getElementById('practice-area').innerHTML = renderPracticeQuiz(MOCKTEST_BANK.slice(0,5)); render(); },
  restartPractice(){ practiceState = {answers:{}, submitted:false}; render(); },

  /* ---- interview setup ---- */
  startInterviewSetup(mode){ setupState = {mode, resumeText:'', jdText:'', detected:null, jdDetected:null, selectedSkills:{}, includeMatch:false, qCount:5}; interviewConfig = {level:null}; navigate('interview-setup', {mode}); },
  handleResumeUpload(ev){
    const file = ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){ setupState.resumeText = String(e.target.result||'').slice(0,4000); render(); };
    reader.onerror = function(){ setupState.resumeText = 'Java Spring Boot SQL React project e-commerce'; render(); };
    try{ reader.readAsText(file); }catch(e){ setupState.resumeText = 'Java Spring Boot SQL React project e-commerce'; render(); }
  },
  useDemoResume(){ setupState.resumeText = 'Experienced in Java, Spring Boot, SQL and React. Built an E-commerce Application and a Student Management System. B.Tech Computer Science.'; render(); },
  analyzeResume(){ setupState.detected = AIServices.parseResume(setupState.resumeText); render(); },
  setJDText(v){ setupState.jdText = v; },
  useDemoJD(){ setupState.jdText = 'We are hiring a Java Backend Developer with strong Spring and SQL experience. AWS and Docker knowledge preferred.'; render(); },
  analyzeJD(){ const ta = document.getElementById('jd-textarea'); if(ta) setupState.jdText = ta.value; setupState.jdDetected = AIServices.parseJD(setupState.jdText); render(); },
  toggleMatch(){ setupState.includeMatch = !setupState.includeMatch; render(); },
  toggleSkillSelect(id){ if(setupState.selectedSkills[id]) delete setupState.selectedSkills[id]; else setupState.selectedSkills[id]=true; render(); },
  setQCount(n){ setupState.qCount = n; render(); },

  setInterviewLevel(key){ interviewConfig.level = key; render(); },

  requestCamera(){
    state.interviewSession = state.interviewSession || buildInterviewSession();
    state.interviewSession.camera.requested = true;
    state.interviewSession.camera.active = true;
    render();
  },
  skipCamera(){
    state.interviewSession = state.interviewSession || buildInterviewSession();
    state.interviewSession.camera.requested = true;
    state.interviewSession.camera.active = false;
    render();
  },

  speakQuestion(){
    const s = state.interviewSession; if(!s) return;
    const q = s.questions[s.idx];
    const cap = document.getElementById('caption-box');
    const avatar = document.getElementById('ai-avatar');
    if(avatar) avatar.classList.add('talking');
    if(cap) cap.innerHTML = q.q;
    speakText(q.q, function(){ if(avatar) avatar.classList.remove('talking'); });
  },

  toggleMic(){
    const s = state.interviewSession; if(!s) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!s.mic.listening){
      s.mic.listening = true;
      if(SR){
        try{
          recognizer = new SR();
          recognizer.continuous = true; recognizer.interimResults = true; recognizer.lang='en-US';
          recognizer.onresult = function(e){
            let t = '';
            for(let i=0;i<e.results.length;i++){ t += e.results[i][0].transcript + ' '; }
            s.mic.transcript = t.trim();
            const tb = document.getElementById('transcript-box'); if(tb) tb.innerHTML = '<b>YOUR ANSWER</b><br/>'+s.mic.transcript;
            const ta = document.getElementById('manual-answer'); if(ta) ta.value = s.mic.transcript;
          };
          recognizer.onerror = function(){};
          recognizer.start();
        }catch(e){ /* fall through to manual typing */ }
      }
      render();
    } else {
      s.mic.listening = false;
      if(recognizer){ try{ recognizer.stop(); }catch(e){} }
      render();
    }
  },
  updateManualAnswer(v){ if(state.interviewSession) state.interviewSession.mic.transcript = v; },

  submitAnswer(){
    const s = state.interviewSession; if(!s) return;
    const q = s.questions[s.idx];
    const transcript = s.mic.transcript || '';
    const evalRes = AIServices.evaluateAnswer(q, transcript);
    s.answers.push({question:q, transcript, eval:evalRes});

    // dynamic follow-up
    let inserted = false;
    if(q.followUp && s.level!=='beginner'){
      const hay = transcript.toLowerCase();
      if(q.followUp.trigger.some(k=>hay.includes(k))){
        s.questions.splice(s.idx+1, 0, q.followUp.question);
        inserted = true;
      }
    }

    const box = document.getElementById('eval-result');
    if(box){
      box.innerHTML = '<div class="eval-grid">'+
        cell('Technical', evalRes.technical)+cell('Relevance', evalRes.relevance)+cell('Communication', evalRes.communication)+cell('Confidence', evalRes.confidence)+cell('Completeness', evalRes.completeness)+
        '</div>'+
        '<div class="feedback-note">'+evalRes.tip+'</div>'+
        '<div style="text-align:right;margin-top:14px;"><button class="btn btn-amber btn-sm" onclick="App.nextQuestion()">'+(s.idx+1>=s.questions.length? 'See results' : 'Next question')+'</button></div>';
    }
    function cell(label,val){ return '<div class="eval-cell"><b>'+val+'/10</b><span>'+label+'</span></div>'; }
  },

  nextQuestion(){
    const s = state.interviewSession; if(!s) return;
    if(recognizer){ try{ recognizer.stop(); }catch(e){} }
    s.mic.listening = false; s.mic.transcript='';
    if(s.idx+1 >= s.questions.length){
      if(s.camera.stream){ s.camera.stream.getTracks().forEach(t=>t.stop()); }
      navigate('interview-results');
    } else {
      s.idx++;
      render();
    }
  },

  retryInterview(){
    state.interviewSession = null;
    mockTestState = {answers:{}, submitted:false};
    navigate('interview-level');
  },

  /* ---- mock test ---- */
  selectMockTestAnswer(i,oi){ mockTestState.answers[i]=oi; render(); },
  submitMockTest(){ mockTestState.submitted = true; addXP(15); render(); },
};

/* =========================================================================
   INIT
========================================================================= */
render();
</script>
